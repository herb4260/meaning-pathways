codes:
  belief_violation: Existing assumptions or beliefs are disrupted by the stressor.
  goal_violation: Important goals or expected futures are blocked or lost.
  meaning_search: Active attempts to understand significance or purpose.
  positive_religious_coping: Religious/spiritual resources used to reappraise, connect,
    or cope.
  spiritual_struggle: Religious/spiritual conflict, abandonment, anger, guilt, or
    doubt.
  meaning_reconstruction: A more coherent or workable interpretation emerges.
  changed_priorities: Values, goals, or priorities are reorganized.
  recovery_future_orientation: Renewed hope, agency, functioning, or future possibility.
