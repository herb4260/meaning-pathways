name: project-checks

on:
  push:
  pull_request:

jobs:
  python-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  r-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("lavaan", "ggplot2"), repos="https://cloud.r-project.org")'
      - name: Run model pipeline
        run: Rscript scripts/run_all.R
